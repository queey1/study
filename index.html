<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TODO</title>
  <style>
    :root {
      --ink: #302628;
      --muted: #7f6a70;
      --paper: rgba(255, 252, 247, 0.9);
      --paper-solid: #fffaf4;
      --line: rgba(71, 50, 48, 0.14);
      --rose: #d84b68;
      --rose-dark: #ab304d;
      --peach: #ffb58f;
      --mint: #87bfa4;
      --gold: #d5a34d;
      --blue: #6b91bf;
      --shadow: 0 24px 60px rgba(89, 49, 53, 0.18);
      --radius: 18px;
      --font-title: "Yu Mincho", "STSong", Georgia, serif;
      --font-body: "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--ink);
      font-family: var(--font-body);
      background:
        linear-gradient(120deg, rgba(255, 247, 232, 0.86), rgba(255, 218, 220, 0.78)),
        var(--custom-bg, radial-gradient(circle at top left, #ffd7b8 0, transparent 34%), linear-gradient(135deg, #fff3e0, #f6d0d8 55%, #c7dfd3));
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    .ambient {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .ambient span {
      position: absolute;
      display: block;
      color: rgba(216, 75, 104, 0.34);
      font-family: Georgia, serif;
      font-size: var(--size, 18px);
      line-height: 1;
      text-shadow: 0 5px 14px rgba(171, 48, 77, 0.16);
      opacity: 0;
      animation: drift-heart var(--duration, 13s) var(--delay, 0s) ease-in-out infinite;
    }

    .ambient .particle {
      width: var(--size, 10px);
      height: var(--size, 10px);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.58);
      box-shadow: 0 4px 12px rgba(216, 75, 104, 0.14);
    }

    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }

    .app {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      padding: 28px clamp(14px, 3vw, 34px) 40px;
      backdrop-filter: saturate(112%);
    }

    .shell {
      max-width: 1180px;
      margin: 0 auto;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(280px, 0.8fr);
      gap: 18px;
      align-items: stretch;
      margin-bottom: 18px;
    }

    .hero-main, .panel, .dialog-card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .hero-main {
      position: relative;
      overflow: hidden;
      padding: clamp(22px, 4vw, 38px);
      animation: breathe 6s ease-in-out infinite;
    }

    .corner-menu {
      position: absolute;
      top: 18px;
      right: 18px;
      z-index: 5;
    }

    .corner-menu[open] .menu-trigger {
      background: rgba(255, 245, 247, 0.94);
      color: var(--rose-dark);
      box-shadow: 0 12px 22px rgba(89, 49, 53, 0.12);
    }

    .menu-trigger {
      list-style: none;
      width: 38px;
      height: 38px;
      border: 1px solid rgba(216, 75, 104, 0.16);
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, 0.76);
      color: var(--ink);
      cursor: pointer;
      user-select: none;
      font-size: 24px;
      line-height: 1;
      backdrop-filter: blur(16px);
    }

    .menu-trigger::-webkit-details-marker { display: none; }

    .menu-popover {
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      width: 172px;
      padding: 10px;
      display: grid;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255, 251, 247, 0.94);
      box-shadow: 0 18px 40px rgba(89, 49, 53, 0.16);
      backdrop-filter: blur(18px);
    }

    .menu-item {
      width: 100%;
      min-height: 38px;
      border: 0;
      border-radius: 12px;
      padding: 8px 10px;
      text-align: left;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.68);
    }

    .menu-item:hover {
      background: rgba(255, 243, 245, 0.92);
    }

    .hero-main::before {
      content: "";
      position: absolute;
      inset: auto -60px -90px auto;
      width: 250px;
      height: 250px;
      background: conic-gradient(from 30deg, rgba(216, 75, 104, 0.24), rgba(255, 181, 143, 0.22), rgba(135, 191, 164, 0.18), rgba(216, 75, 104, 0.24));
      border-radius: 42% 58% 48% 52%;
      filter: blur(2px);
      transform: rotate(-12deg);
    }

    .hero-main::after {
      content: "";
      position: absolute;
      inset: 18px auto auto -48px;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.34), rgba(255, 255, 255, 0));
      pointer-events: none;
    }

    .kicker {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px;
      color: var(--rose-dark);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .kicker span {
      display: inline-grid;
      place-items: center;
      width: 26px;
      height: 26px;
      border-radius: 999px;
      color: white;
      background: var(--rose);
    }

    h1 {
      position: relative;
      margin: 0;
      font-family: var(--font-title);
      font-size: clamp(36px, 7vw, 78px);
      line-height: 0.95;
      letter-spacing: 0;
    }

    .subtitle {
      position: relative;
      max-width: 620px;
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.75;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 24px;
      max-width: 620px;
    }

    .stat {
      min-height: 86px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.54);
      animation: gentle-bob 4.5s ease-in-out infinite;
    }

    .stat:nth-child(2) { animation-delay: -1.5s; }
    .stat:nth-child(3) { animation-delay: -3s; }

    .stat strong {
      display: block;
      font-size: 28px;
      line-height: 1;
      color: var(--rose-dark);
    }

    .stat span {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .btn {
      min-height: 42px;
      border: 0;
      border-radius: 999px;
      padding: 10px 15px;
      color: white;
      background: var(--rose);
      box-shadow: 0 10px 24px rgba(216, 75, 104, 0.24);
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    .btn:hover { transform: translateY(-1px); box-shadow: 0 14px 28px rgba(216, 75, 104, 0.28); }
    .btn.secondary { color: var(--ink); background: rgba(255,255,255,0.72); border: 1px solid var(--line); box-shadow: none; }
    .btn.ghost { color: var(--rose-dark); background: transparent; border: 1px solid rgba(216, 75, 104, 0.28); box-shadow: none; }
    .btn.small { min-height: 34px; padding: 7px 12px; font-size: 13px; }
    .btn.danger { background: #b44a42; }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    .panel {
      padding: 16px;
      animation: breathe 7s ease-in-out infinite;
    }

    .layout > .panel { animation-delay: -2.4s; }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) repeat(3, 150px) auto;
      gap: 10px;
      margin-bottom: 14px;
    }

    .toolbar.hidden {
      display: none;
    }

    .toolbar-actions {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 10px;
    }

    .category-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .category-chip {
      min-height: 34px;
      border: 1px solid rgba(216, 75, 104, 0.14);
      border-radius: 999px;
      padding: 7px 12px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.68);
    }

    .category-chip.active {
      color: var(--rose-dark);
      background: rgba(255, 244, 246, 0.92);
      border-color: rgba(216, 75, 104, 0.28);
      box-shadow: 0 8px 18px rgba(89, 49, 53, 0.08);
    }

    .field, .select, textarea {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 13px;
      padding: 10px 12px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.72);
      outline: none;
    }

    textarea { min-height: 94px; resize: vertical; }
    .field:focus, .select:focus, textarea:focus { border-color: rgba(216, 75, 104, 0.5); box-shadow: 0 0 0 3px rgba(216, 75, 104, 0.11); }

    .categories {
      display: grid;
      gap: 9px;
      margin: 12px 0 16px;
    }

    .cat {
      width: 100%;
      display: grid;
      grid-template-columns: 20px 1fr auto;
      align-items: center;
      gap: 10px;
      border: 1px solid transparent;
      border-radius: 14px;
      padding: 11px 10px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.5);
      text-align: left;
    }

    .cat.active {
      border-color: rgba(216, 75, 104, 0.28);
      background: rgba(255, 245, 247, 0.92);
      box-shadow: 0 10px 24px rgba(158, 74, 83, 0.12);
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      background: var(--cat-color, var(--rose));
    }

    .cat small {
      color: var(--muted);
      font-size: 12px;
    }

    .panel-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .panel-title h2, .panel-title h3 {
      margin: 0;
      font-size: 18px;
    }

    .list-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .list-head h2 {
      margin: 0;
      font-size: 22px;
    }

    .main-actions {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 14px;
    }

    .main-actions .btn {
      min-height: 38px;
      padding: 8px 10px;
      border-radius: 14px;
      font-size: 13px;
      box-shadow: none;
    }

    .photo-showcase {
      position: relative;
      overflow: hidden;
      margin-top: 16px;
      border: 1px solid rgba(216, 75, 104, 0.14);
      border-radius: 24px;
      background:
        linear-gradient(155deg, rgba(255, 250, 246, 0.96), rgba(255, 241, 245, 0.82)),
        rgba(255, 255, 255, 0.76);
      box-shadow: 0 18px 36px rgba(89, 49, 53, 0.1);
    }

    .photo-showcase::before {
      content: "";
      position: absolute;
      inset: auto -22px -36px auto;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(216, 75, 104, 0.16), rgba(216, 75, 104, 0));
      pointer-events: none;
    }

    .photo-stage {
      position: relative;
      aspect-ratio: 4 / 5;
      overflow: hidden;
      border-radius: 20px;
      background: linear-gradient(145deg, rgba(255, 247, 239, 0.96), rgba(246, 219, 225, 0.82));
    }

    .photo-stage img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      animation: photo-fade 0.48s ease;
    }

    .photo-empty {
      display: grid;
      place-items: center;
      min-height: 280px;
      padding: 24px;
      text-align: center;
      color: var(--muted);
      line-height: 1.7;
      background:
        radial-gradient(circle at top, rgba(255, 255, 255, 0.74), rgba(255, 255, 255, 0)),
        linear-gradient(145deg, rgba(255, 247, 239, 0.98), rgba(247, 223, 229, 0.78));
    }

    .photo-empty strong {
      display: block;
      margin-bottom: 8px;
      color: var(--rose-dark);
      font-size: 18px;
    }

    .cards {
      display: grid;
      gap: 12px;
    }

    .inline-create {
      margin-bottom: 12px;
      padding: 14px;
      border: 1px solid rgba(216, 75, 104, 0.16);
      border-radius: 18px;
      background: rgba(255, 249, 246, 0.72);
      box-shadow: 0 10px 24px rgba(89, 49, 53, 0.08);
    }

    .inline-create-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .inline-create-head strong {
      display: block;
      font-size: 15px;
    }

    .inline-create-head span {
      color: var(--muted);
      font-size: 12px;
    }

    .inline-create-form {
      display: grid;
      gap: 10px;
      margin-top: 12px;
    }

    .inline-create-form textarea {
      min-height: 88px;
    }

    .inline-create-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .task-card {
      position: relative;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 12px;
      align-items: start;
      padding: 14px;
      border: 1px solid var(--line);
      border-left: 5px solid var(--cat-color, var(--rose));
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.68);
      animation: card-arrive 0.42s ease both;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .task-card:hover { transform: translateY(-1px); box-shadow: 0 14px 26px rgba(89, 49, 53, 0.11); }
    .task-card.done { opacity: 0.66; }
    .task-card.done .task-title { text-decoration: line-through; }

    .task-card::after {
      content: "";
      position: absolute;
      inset: auto 16px 0 16px;
      height: 24px;
      background: radial-gradient(circle at center, rgba(216, 75, 104, 0.08), rgba(216, 75, 104, 0));
      pointer-events: none;
    }

    .check {
      width: 24px;
      height: 24px;
      border: 2px solid rgba(216, 75, 104, 0.42);
      border-radius: 8px;
      background: white;
      color: white;
      display: grid;
      place-items: center;
      margin-top: 2px;
    }

    .task-card.done .check { background: var(--mint); border-color: var(--mint); }

    .task-title {
      margin: 0 0 6px;
      font-size: 17px;
      line-height: 1.35;
      word-break: break-word;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      color: var(--muted);
      font-size: 12px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-height: 24px;
      border-radius: 999px;
      padding: 3px 8px;
      background: rgba(255, 242, 226, 0.88);
      border: 1px solid rgba(127, 106, 112, 0.12);
    }

    .pill.high { color: #9f332f; background: rgba(255, 226, 221, 0.92); }
    .pill.medium { color: #8a6220; background: rgba(255, 241, 207, 0.92); }
    .pill.low { color: #39725c; background: rgba(224, 244, 234, 0.92); }

    .note {
      margin-top: 9px;
      color: #604f53;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .subtasks {
      display: grid;
      gap: 7px;
      margin-top: 10px;
    }

    .subtask {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 8px;
      align-items: center;
      padding: 7px 9px;
      border-radius: 11px;
      background: rgba(255, 250, 244, 0.82);
      border: 1px solid rgba(127, 106, 112, 0.1);
      font-size: 13px;
    }

    .subtask.done span { text-decoration: line-through; color: var(--muted); }

    .task-actions {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 11px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.72);
      color: var(--ink);
    }

    .empty {
      padding: 38px 18px;
      text-align: center;
      border: 1px dashed rgba(127, 106, 112, 0.34);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.48);
      color: var(--muted);
      line-height: 1.7;
    }

    .dialog {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      place-items: center;
      padding: 18px;
      background: rgba(54, 37, 39, 0.28);
    }

    .dialog.open { display: grid; }

    .dialog-card {
      width: min(720px, 100%);
      max-height: min(86vh, 780px);
      overflow: auto;
      padding: 18px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .form-grid .full { grid-column: 1 / -1; }
    label { display: grid; gap: 6px; color: var(--muted); font-size: 13px; }
    label strong { color: var(--ink); font-size: 14px; }

    .subtask-editor {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 16px;
    }

    .hidden { display: none !important; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      z-index: 30;
      transform: translateX(-50%) translateY(20px);
      opacity: 0;
      padding: 10px 14px;
      border-radius: 999px;
      color: white;
      background: rgba(48, 38, 40, 0.9);
      transition: opacity 0.18s ease, transform 0.18s ease;
      pointer-events: none;
    }

    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .file-row { display: grid; gap: 9px; }
    .fineprint { color: var(--muted); font-size: 12px; line-height: 1.55; }

    .sync-status {
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.58);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
      white-space: pre-wrap;
    }

    @keyframes drift-heart {
      0%, 100% { opacity: 0; transform: translate3d(0, 14px, 0) rotate(-8deg) scale(0.85); }
      15%, 82% { opacity: 0.82; }
      50% { transform: translate3d(var(--drift, 22px), -42px, 0) rotate(10deg) scale(1); }
    }

    @keyframes gentle-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    @keyframes breathe {
      0%, 100% { box-shadow: var(--shadow); }
      50% { box-shadow: 0 28px 66px rgba(89, 49, 53, 0.22); }
    }

    @keyframes card-arrive {
      from { opacity: 0; transform: translateY(7px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes done-bloom {
      0%, 100% { box-shadow: 0 0 0 0 rgba(135, 191, 164, 0.12); transform: scale(1); }
      50% { box-shadow: 0 0 0 8px rgba(135, 191, 164, 0); transform: scale(1.04); }
    }

    @keyframes float-poster {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    @keyframes photo-fade {
      from { opacity: 0.4; transform: scale(1.02); }
      to { opacity: 1; transform: scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }

    @media (max-width: 900px) {
      .hero, .layout { grid-template-columns: 1fr; }
      .toolbar { grid-template-columns: 1fr 1fr 1fr; }
      .toolbar .field { grid-column: 1 / -1; }
    }

    @media (max-width: 560px) {
      body {
        background:
          linear-gradient(145deg, rgba(255, 246, 232, 0.78), rgba(255, 220, 226, 0.66)),
          radial-gradient(circle at 15% 15%, rgba(255, 255, 255, 0.74), transparent 30%),
          linear-gradient(135deg, #fff1de, #f9d6db 55%, #d3e6de);
      }

      .ambient {
        transform: scale(1.08);
        filter: saturate(118%);
      }

      .ambient span {
        color: rgba(216, 75, 104, 0.44);
        text-shadow: 0 8px 20px rgba(171, 48, 77, 0.24);
      }

      .ambient span:nth-child(1) { left: 2% !important; top: 10% !important; --size: 28px; }
      .ambient span:nth-child(2) { left: 10% !important; top: 74% !important; --size: 10px; }
      .ambient span:nth-child(3) { left: 18% !important; top: 32% !important; --size: 20px; }
      .ambient span:nth-child(4) { left: 33% !important; top: 6% !important; --size: 12px; }
      .ambient span:nth-child(5) { left: 80% !important; top: 70% !important; --size: 30px; }
      .ambient span:nth-child(6) { left: 61% !important; top: 24% !important; --size: 10px; }
      .ambient span:nth-child(7) { left: 74% !important; top: 8% !important; --size: 22px; }
      .ambient span:nth-child(8) { left: 86% !important; top: 82% !important; --size: 14px; }
      .ambient span:nth-child(9) { left: 88% !important; top: 38% !important; --size: 28px; }
      .ambient span:nth-child(10) { left: 5% !important; top: 46% !important; --size: 24px; }
      .ambient span:nth-child(11) { left: 26% !important; top: 86% !important; --size: 16px; }
      .ambient span:nth-child(12) { left: 45% !important; top: 14% !important; --size: 12px; }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return structuredClone(defaultState);
        const parsed = JSON.parse(raw);
        return normalizeState({
          activeCategory: parsed.activeCategory || "all",
          categories: parsed.categories?.length ? parsed.categories : structuredClone(defaultState.categories),
          tasks: Array.isArray(parsed.tasks) ? parsed.tasks : []
        });
      } catch (error) {
        return structuredClone(defaultState);
      }
    }

    function saveLocalState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function loadPhotoState() {
      try {
        const raw = localStorage.getItem(PHOTO_STORAGE_KEY);
        const parsed = raw ? JSON.parse(raw) : {};
        return normalizePhotoState(parsed);
      } catch (error) {
        return { slides: [], currentIndex: 0 };
      }
    }

    function normalizePhotoState(nextPhotoState, fallbackIndex = 0) {
      const slides = Array.isArray(nextPhotoState?.slides)
        ? nextPhotoState.slides.filter((slide) => slide?.dataUrl).map((slide, index) => ({
          id: String(slide.id || makeId()),
          name: String(slide.name || `照片 ${index + 1}`),
          dataUrl: String(slide.dataUrl || "")
        }))
        : [];

      return {
        slides,
        currentIndex: Math.min(Number(nextPhotoState?.currentIndex ?? fallbackIndex) || 0, Math.max(0, slides.length - 1))
      };
    }

    function savePhotoState(sharedChanged = false) {
      if (sharedChanged) {
        state.updatedAt = Date.now();
      }
      localStorage.setItem(PHOTO_STORAGE_KEY, JSON.stringify({
        slides: photoState.slides,
        currentIndex: photoState.currentIndex
      }));
      if (sharedChanged) {
        saveLocalState();
        scheduleRemotePush();
      }
    }

    function saveState(sharedChanged = true) {
      if (sharedChanged) {
        state.updatedAt = Date.now();
      }
      saveLocalState();
      if (sharedChanged) {
        scheduleRemotePush();
      }
    }

    function normalizeState(nextState) {
      const categories = orderCategories((nextState.categories || []).filter((category) => !REMOVED_CATEGORY_IDS.includes(category.id)));
      const validCategoryIds = new Set(categories.map((category) => category.id));
      const tasks = (nextState.tasks || []).filter((task) => validCategoryIds.has(task.categoryId));
      return {
        activeCategory: validCategoryIds.has(nextState.activeCategory) ? nextState.activeCategory : "all",
        updatedAt: Number(nextState.updatedAt) || Math.max(0, ...(tasks.map((task) => Number(task.createdAt) || 0))),
        categories: categories.length ? categories : structuredClone(defaultState.categories),
        tasks
      };
    }

    function loadSyncConfig() {
      try {
        const raw = localStorage.getItem(SYNC_CONFIG_KEY);
        const parsed = raw ? JSON.parse(raw) : {};
        return {
          gistId: String(parsed.gistId || "").trim(),
          fileName: String(parsed.fileName || SYNC_DEFAULT_FILE).trim() || SYNC_DEFAULT_FILE,
          token: localStorage.getItem(SYNC_TOKEN_KEY) || sessionStorage.getItem(SYNC_TOKEN_KEY) || "",
          lastRemoteUpdatedAt: Number(parsed.lastRemoteUpdatedAt) || 0
        };
      } catch (error) {
        return {
          gistId: "",
          fileName: SYNC_DEFAULT_FILE,
          token: localStorage.getItem(SYNC_TOKEN_KEY) || sessionStorage.getItem(SYNC_TOKEN_KEY) || "",
          lastRemoteUpdatedAt: 0
        };
      }
    }

    function persistSyncConfig() {
      localStorage.setItem(SYNC_CONFIG_KEY, JSON.stringify({
        gistId: syncConfig.gistId,
        fileName: syncConfig.fileName || SYNC_DEFAULT_FILE,
        lastRemoteUpdatedAt: Number(syncConfig.lastRemoteUpdatedAt) || 0
      }));

      if (syncConfig.token) {
        localStorage.setItem(SYNC_TOKEN_KEY, syncConfig.token);
        sessionStorage.removeItem(SYNC_TOKEN_KEY);
      } else {
        localStorage.removeItem(SYNC_TOKEN_KEY);
        sessionStorage.removeItem(SYNC_TOKEN_KEY);
      }
    }

    function populateSyncForm() {
      els.syncGistId.value = syncConfig.gistId || "";
      els.syncFileName.value = syncConfig.fileName || SYNC_DEFAULT_FILE;
      els.syncToken.value = syncConfig.token || "";
    }

    async function setupSync({ preferRemote = false } = {}) {
      window.clearInterval(syncPullTimer);
      syncPullTimer = null;

      if (!syncConfig.gistId) {
        updateSyncStatus("未连接 GitHub 同步\n当前仍然只会保存在本地浏览器里。");
        return { applied: false, remoteMissing: false };
      }

      updateSyncStatus(syncConfig.token
        ? "已连接 Gist，正在检查远端内容…"
        : "已填写 Gist ID，但当前没有 token。现在是只读同步：能拉取别人的修改，不能把本地修改写回 GitHub。");

      const initialPull = await pullRemoteState({ silent: true, force: preferRemote });
      syncPullTimer = window.setInterval(() => {
        void pullRemoteState({ silent: true });
      }, SYNC_POLL_MS);
      return initialPull;
    }

    function render() {
      renderStats();
      renderPhotoShowcase();
      renderCategories();
      renderCategoryOptions();
      renderDateTaskCreator();
      renderTasks();
    }

    function renderPhotoShowcase() {
      const slides = photoState.slides || [];
      const total = slides.length;

      if (!total) {
        els.photoShowcase.innerHTML = `
          <div class="photo-empty">
            <div>
              <strong>你们的照片小窗口</strong>
              <div>点右上角菜单里的“选择轮播照片”，这里就会自动循环播放。</div>
            </div>
          </div>
        `;
        return;
      }

      photoState.currentIndex = ((photoState.currentIndex % total) + total) % total;
      const activeSlide = slides[photoState.currentIndex];

      els.photoShowcase.innerHTML = `
        <div class="photo-stage">
          <img src="${escapeAttribute(activeSlide.dataUrl)}" alt="${escapeAttribute(activeSlide.name)}" />
        </div>
      `;
    }

    function startPhotoLoop() {
      window.clearInterval(photoLoopTimer);
      photoLoopTimer = null;
      if ((photoState.slides || []).length <= 1) return;
      photoLoopTimer = window.setInterval(() => {
        shiftPhoto(1, { silent: true });
      }, PHOTO_LOOP_MS);
    }

    function shiftPhoto(step, { silent = false } = {}) {
      const total = photoState.slides.length;
      if (!total) return;
      photoState.currentIndex = (photoState.currentIndex + step + total) % total;
      savePhotoState();
      renderPhotoShowcase();
      if (!silent) startPhotoLoop();
    }

    function openPhotoPicker() {
      closeCornerMenu();
      els.photoPicker.click();
    }

    async function importPhotos(event) {
      const files = [...(event.target.files || [])].filter((file) => file.type.startsWith("image/"));
      if (!files.length) return;

      try {
        const slides = [];
        for (const file of files) {
          slides.push(await fileToSlide(file));
        }
        photoState = {
          slides,
          currentIndex: 0
        };
        savePhotoState(true);
        renderPhotoShowcase();
        startPhotoLoop();
        toast(`已更新 ${slides.length} 张轮播照片`);
      } catch (error) {
        toast("照片读取失败，请换几张更小的图片试试");
      } finally {
        els.photoPicker.value = "";
      }
    }

    async function fileToSlide(file) {
      const dataUrl = await readFileAsDataUrl(file);
      const compressedDataUrl = await compressImageDataUrl(dataUrl);
      return {
        id: makeId(),
        name: file.name.replace(/\.[^.]+$/, "") || "你们的照片",
        dataUrl: compressedDataUrl
      };
    }

    function readFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ""));
        reader.onerror = () => reject(new Error("读取失败"));
        reader.readAsDataURL(file);
      });
    }

    function compressImageDataUrl(dataUrl) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => {
          const maxSide = 1400;
          const scale = Math.min(1, maxSide / Math.max(image.width, image.height));
          const canvas = document.createElement("canvas");
          canvas.width = Math.max(1, Math.round(image.width * scale));
          canvas.height = Math.max(1, Math.round(image.height * scale));
          const context = canvas.getContext("2d");
          if (!context) return reject(new Error("画布初始化失败"));
          context.drawImage(image, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL("image/jpeg", 0.82));
        };
        image.onerror = () => reject(new Error("图片解析失败"));
        image.src = dataUrl;
      });
    }

    function renderStats() {
      const total = state.tasks.length;
      const done = state.tasks.filter((task) => task.done).length;
      const open = total - done;
      const songs = state.tasks.flatMap((task) => task.subtasks || []).length;
      els.stats.innerHTML = `
        <div class="stat"><strong>${open}</strong><span>还想一起完成</span></div>
        <div class="stat"><strong>${done}</strong><span>已经完成</span></div>
        <div class="stat"><strong>${songs}</strong><span>子事项 / 曲目</span></div>
      `;
    }

    function renderCategories() {
      const allCount = state.tasks.length;
      const categoryRows = [{ id: "all", name: "全部事项", color: "#d84b68", count: allCount }, ...orderCategories(state.categories).map((category) => ({
        ...category,
        count: state.tasks.filter((task) => task.categoryId === category.id).length
      }))];

      els.categories.innerHTML = categoryRows.map((category) => `
        <button class="category-chip ${state.activeCategory === category.id ? "active" : ""}" data-category-id="${category.id}">
          ${escapeHtml(category.name)} · ${category.count}
        </button>
      `).join("");

      els.categories.querySelectorAll(".category-chip").forEach((button) => {
        button.addEventListener("click", () => {
          state.activeCategory = button.dataset.categoryId;
          saveState(false);
          closeDateTaskCreator();
          render();
        });
      });
    }

    function renderCategoryOptions() {
      els.taskCategory.innerHTML = orderCategories(state.categories).map((category) => `<option value="${category.id}">${escapeHtml(category.name)}</option>`).join("");
    }

    function renderDateTaskCreator() {
      const visible = state.activeCategory === "date";
      els.dateTaskCreator.classList.toggle("hidden", !visible);
      if (!visible) closeDateTaskCreator();
    }

    function renderTasks() {
      const tasks = getFilteredTasks();
      const category = state.categories.find((item) => item.id === state.activeCategory);
      els.currentCategoryName.textContent = category ? category.name : "全部事项";

      if (!tasks.length) {
        const emptyMessage = state.activeCategory === "date"
          ? "这里还没有约会安排。可以直接在上方添加新的约会事项。"
          : "这里还没有符合条件的事项。试试切换筛选条件或选择其他清单。";
        els.taskList.innerHTML = `<div class="empty">${emptyMessage}</div>`;
        renderStats();
        return;
      }

      els.taskList.innerHTML = tasks.map((task) => {
        const categoryInfo = getCategory(task.categoryId);
        const priorityText = { high: "很想完成", medium: "本周想做", low: "慢慢来" }[task.priority] || "慢慢来";
        const tags = (task.tags || []).map((tag) => `<span class="pill">#${escapeHtml(tag)}</span>`).join("");
        const subtasks = (task.subtasks || []).map((subtask) => `
          <div class="subtask ${subtask.done ? "done" : ""}">
            <input type="checkbox" ${subtask.done ? "checked" : ""} data-subtask-toggle="${task.id}:${subtask.id}" />
            <span>${escapeHtml(subtask.text)}</span>
            <button class="icon-btn" data-subtask-delete="${task.id}:${subtask.id}" title="删除">×</button>
          </div>
        `).join("");

        return `
          <article class="task-card ${task.done ? "done" : ""}" style="--cat-color:${categoryInfo.color}">
            <button class="check" data-toggle-task="${task.id}" aria-label="切换完成状态">✓</button>
            <div>
              <h3 class="task-title">${escapeHtml(task.title)}</h3>
              <div class="meta">
                <span class="pill">${escapeHtml(categoryInfo.name)}</span>
                <span class="pill">${escapeHtml(task.owner || "一起")}</span>
                ${task.date ? `<span class="pill">${formatDate(task.date)}</span>` : ""}
                <span class="pill ${task.priority}">${priorityText}</span>
                ${tags}
              </div>
              ${task.note ? `<div class="note">${escapeHtml(task.note)}</div>` : ""}
              ${subtasks ? `<div class="subtasks">${subtasks}</div>` : ""}
            </div>
            <div class="task-actions">
              <button class="icon-btn" data-edit-task="${task.id}" title="编辑">✎</button>
              <button class="icon-btn" data-delete-task="${task.id}" title="删除">×</button>
            </div>
          </article>
        `;
      }).join("");

      els.taskList.querySelectorAll("[data-toggle-task]").forEach((button) => {
        button.addEventListener("click", () => toggleTask(button.dataset.toggleTask));
      });
      els.taskList.querySelectorAll("[data-edit-task]").forEach((button) => {
        button.addEventListener("click", () => openTaskDialog(button.dataset.editTask));
      });
      els.taskList.querySelectorAll("[data-delete-task]").forEach((button) => {
        button.addEventListener("click", () => deleteTask(button.dataset.deleteTask));
      });
      els.taskList.querySelectorAll("[data-subtask-toggle]").forEach((checkbox) => {
        checkbox.addEventListener("change", () => toggleSubtask(checkbox.dataset.subtaskToggle));
      });
      els.taskList.querySelectorAll("[data-subtask-delete]").forEach((button) => {
        button.addEventListener("click", () => deleteSubtask(button.dataset.subtaskDelete));
      });

      renderStats();
    }

    function getFilteredTasks() {
      const keyword = els.searchInput.value.trim().toLowerCase();
      return state.tasks
        .filter((task) => state.activeCategory === "all" || task.categoryId === state.activeCategory)
        .filter((task) => els.statusFilter.value === "all" || (els.statusFilter.value === "done" ? task.done : !task.done))
        .filter((task) => els.ownerFilter.value === "all" || task.owner === els.ownerFilter.value)
        .filter((task) => !els.dateFilter.value || task.date === els.dateFilter.value)
        .filter((task) => {
          if (!keyword) return true;
          const haystack = [
            task.title,
            task.note,
            task.owner,
            ...(task.tags || []),
            ...(task.subtasks || []).map((subtask) => subtask.text)
          ].join(" ").toLowerCase();
          return haystack.includes(keyword);
        })
        .sort((a, b) => Number(a.done) - Number(b.done) || priorityRank(b.priority) - priorityRank(a.priority) || (a.date || "9999").localeCompare(b.date || "9999") || b.createdAt - a.createdAt);
    }

    function openDateTaskCreator() {
      state.activeCategory = "date";
      renderDateTaskCreator();
      els.dateTaskForm.classList.remove("hidden");
      els.dateTaskTitle.focus();
      closeCornerMenu();
    }

    function closeDateTaskCreator() {
      els.dateTaskForm.classList.add("hidden");
      els.dateTaskForm.reset();
      els.dateTaskPriority.value = "medium";
      els.dateTaskOwner.value = "一起";
    }

    function saveDateTaskFromForm(event) {
      event.preventDefault();
      const title = els.dateTaskTitle.value.trim();
      if (!title) return;

      state.tasks.unshift({
        id: makeId(),
        title,
        categoryId: "date",
        owner: els.dateTaskOwner.value,
        date: els.dateTaskDate.value,
        priority: els.dateTaskPriority.value,
        tags: els.dateTaskTags.value.split(/[,，]/).map((tag) => tag.trim()).filter(Boolean),
        note: els.dateTaskNote.value.trim(),
        done: false,
        subtasks: els.dateTaskSubtasks.value.split(/\r?\n/).map((line) => line.trim()).filter(Boolean).map((text) => ({ id: makeId(), text, done: false })),
        createdAt: Date.now()
      });

      saveState();
      closeDateTaskCreator();
      render();
      toast("已添加约会事项");
    }

    function openTaskDialog(taskId) {
      editingTaskId = taskId || null;
      const task = editingTaskId ? state.tasks.find((item) => item.id === editingTaskId) : null;
      if (editingTaskId && !task) return;
      els.taskDialogTitle.textContent = task ? "编辑事项" : "添加事项";
      els.taskTitle.value = task?.title || "";
      els.taskCategory.value = task?.categoryId || (state.activeCategory !== "all" ? state.activeCategory : state.categories[0]?.id);
      els.taskOwner.value = task?.owner || "一起";
      els.taskDate.value = task?.date || "";
      els.taskPriority.value = task?.priority || "medium";
      els.taskTags.value = (task?.tags || []).join(", ");
      els.taskNote.value = task?.note || "";
      els.subtaskInputs.innerHTML = "";
      (task?.subtasks?.length ? task.subtasks : [{ text: "", done: false }]).forEach((subtask) => addSubtaskInput(subtask.text));
      openDialog("taskDialog");
      els.taskTitle.focus();
    }

    function saveTaskFromForm(event) {
      event.preventDefault();
      const payload = {
        title: els.taskTitle.value.trim(),
        categoryId: els.taskCategory.value,
        owner: els.taskOwner.value,
        date: els.taskDate.value,
        priority: els.taskPriority.value,
        tags: els.taskTags.value.split(/[,，]/).map((tag) => tag.trim()).filter(Boolean),
        note: els.taskNote.value.trim(),
        subtasks: [...els.subtaskInputs.querySelectorAll("input")]
          .map((input) => input.value.trim())
          .filter(Boolean)
          .map((text) => ({ id: makeId(), text, done: false }))
      };

      if (!payload.title) return;

      if (editingTaskId) {
        const index = state.tasks.findIndex((task) => task.id === editingTaskId);
        const oldTask = state.tasks[index];
        const previousSubtasks = oldTask.subtasks || [];
        payload.subtasks = payload.subtasks.map((subtask, subtaskIndex) => ({
          ...subtask,
          id: previousSubtasks[subtaskIndex]?.id || subtask.id,
          done: previousSubtasks[subtaskIndex]?.text === subtask.text ? previousSubtasks[subtaskIndex].done : false
        }));
        state.tasks[index] = { ...oldTask, ...payload };
        toast("事项已更新");
      } else {
        state.tasks.unshift({ id: makeId(), ...payload, done: false, createdAt: Date.now() });
        toast("已添加新事项");
      }

      saveState();
      closeDialog("taskDialog");
      render();
    }

    function addSubtaskInput(value) {
      const row = document.createElement("div");
      row.className = "subtask-editor";
      row.innerHTML = `<input class="field" maxlength="80" placeholder="例如：歌名 - 歌手" value="${escapeAttribute(value)}" /><button class="icon-btn" type="button">×</button>`;
      row.querySelector("button").addEventListener("click", () => row.remove());
      els.subtaskInputs.appendChild(row);
    }

    function toggleTask(taskId) {
      const task = state.tasks.find((item) => item.id === taskId);
      if (!task) return;
      task.done = !task.done;
      saveState();
      renderTasks();
    }

    function toggleSubtask(key) {
      const [taskId, subtaskId] = key.split(":");
      const task = state.tasks.find((item) => item.id === taskId);
      const subtask = task?.subtasks?.find((item) => item.id === subtaskId);
      if (!subtask) return;
      subtask.done = !subtask.done;
      saveState();
      renderTasks();
    }

    function deleteSubtask(key) {
      const [taskId, subtaskId] = key.split(":");
      const task = state.tasks.find((item) => item.id === taskId);
      if (!task) return;
      task.subtasks = (task.subtasks || []).filter((item) => item.id !== subtaskId);
      saveState();
      renderTasks();
      toast("已删除子项");
    }

    function deleteTask(taskId) {
      if (!confirm("确定删除这个事项吗？")) return;
      state.tasks = state.tasks.filter((task) => task.id !== taskId);
      saveState();
      render();
      toast("事项已删除");
    }

    function clearDoneTasks() {
      const doneCount = state.tasks.filter((task) => task.done).length;
      if (!doneCount) return toast("目前没有已完成事项");
      if (!confirm(`确定清理 ${doneCount} 个已完成事项吗？`)) return;
      state.tasks = state.tasks.filter((task) => !task.done);
      saveState();
      render();
      toast("已清理完成项");
    }

    function resetDemo() {
      if (!confirm("恢复示例会替换当前事项和清单，建议先导出备份。继续吗？")) return;
      state = structuredClone(defaultState);
      closeDateTaskCreator();
      saveState();
      render();
      toast("示例已恢复");
    }

    function exportBackup() {
      const backup = {
        version: 2,
        exportedAt: new Date().toISOString(),
        state,
        photos: {
          slides: photoState.slides
        }
      };
      const blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `恋爱待办备份-${new Date().toISOString().slice(0, 10)}.json`;
      link.click();
      URL.revokeObjectURL(url);
    }

    function importBackup(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const backup = JSON.parse(reader.result);
          if (!backup.state?.categories || !Array.isArray(backup.state.tasks)) throw new Error("Invalid backup");
          state = normalizeState(backup.state);
          if (backup.photos) {
            photoState = normalizePhotoState(backup.photos);
            savePhotoState();
          }
          closeDateTaskCreator();
          saveState();
          render();
          startPhotoLoop();
          toast("备份已导入");
        } catch (error) {
          toast("备份文件格式不正确");
        } finally {
          els.backupInput.value = "";
        }
      };
      reader.readAsText(file);
    }

      dialog.setAttribute("aria-hidden", "false");
    }

    function closeDialog(id) {

      dialog.classList.remove("open");
      dialog.setAttribute("aria-hidden", "true");

      els.searchToolbar.classList.add("hidden");

      els.statusFilter.value = "all";
      els.ownerFilter.value = "all";

    function createCategoryFromMenu() {
      closeCornerMenu();
      const name = prompt("输入新清单名称");
      if (!name) return;
      const trimmedName = name.trim();
      if (!trimmedName) return;
      const duplicate = state.categories.some((category) => category.name === trimmedName);
      if (duplicate) return toast("已经有同名清单了");
      const category = {
        id: makeId(),
        name: trimmedName,
        color: CATEGORY_COLOR_POOL[state.categories.length % CATEGORY_COLOR_POOL.length]
      };
      state.categories = orderCategories([...state.categories, category]);
      state.activeCategory = category.id;
      saveState();
      render();
      toast("清单已创建");
    }

    function closeCornerMenu() {
      els.cornerMenu.open = false;
    }

    function canReadSync() {
      return Boolean(syncConfig.gistId);
    }

    function canWriteSync() {
      return Boolean(syncConfig.gistId && syncConfig.token);
    }

    function updateSyncStatus(message) {
      els.syncStatus.textContent = message;
    }

    function buildSharedStatePayload() {
      return {
        version: 2,
        updatedAt: Number(state.updatedAt) || Date.now(),
        categories: state.categories,
        tasks: state.tasks,
        photos: {
          slides: photoState.slides
        }
      };
    }

    function serializeSharedStatePayload(payload) {
      const content = JSON.stringify(payload, null, 2);
      if (new Blob([content]).size > MAX_SYNC_PAYLOAD_BYTES) {
        throw new Error("当前照片太多或太大，超出 Gist 单文件同步上限。请减少照片数量后再同步。");
      }
      return content;
    }

    function applyRemoteState(remoteState) {
      state = normalizeState({
        ...remoteState,
        activeCategory: state.activeCategory
      });
      if (Object.prototype.hasOwnProperty.call(remoteState, "photos")) {
        photoState = normalizePhotoState(remoteState.photos);
        savePhotoState();
      }
      saveLocalState();
      render();
      startPhotoLoop();
    }

    function formatSyncTime(timestamp) {
      if (!timestamp) return "尚未同步";
      return new Date(timestamp).toLocaleString("zh-CN", { hour12: false });
    }

    function githubHeaders(includeToken = false) {
      const headers = {
        Accept: "application/vnd.github+json"
      };
      if (includeToken && syncConfig.token) {
        headers.Authorization = `Bearer ${syncConfig.token}`;
      }
      return headers;
    }

    async function fetchRemoteSnapshot(includeToken = false) {
      const response = await fetch(`https://api.github.com/gists/${encodeURIComponent(syncConfig.gistId)}`, {
        headers: githubHeaders(includeToken)
      });

      if (!response.ok) {
        if (response.status === 404) {
          const error = new Error("没有找到这个 Gist，请检查 Gist ID。");
          error.code = "missing-gist";
          throw error;
        }
        if (response.status === 401 || response.status === 403) {
          const error = new Error("GitHub 拒绝了这次请求，请检查 token 权限或 API 限流。");
          error.code = "auth";
          throw error;
        }
        const error = new Error(`GitHub 请求失败（${response.status}）。`);
        error.code = "request-failed";
        throw error;
      }

      const gist = await response.json();
      const fileName = syncConfig.fileName || SYNC_DEFAULT_FILE;
      const file = gist.files?.[fileName];
      if (!file?.content) {
        const error = new Error(`Gist 里还没有 ${fileName} 这个同步文件。`);
        error.code = "missing-file";
        throw error;
      }

      let remoteState;
      try {
        remoteState = JSON.parse(file.content);
      } catch (error) {
        const parseError = new Error("Gist 文件内容不是有效 JSON。");
        parseError.code = "invalid-json";
        throw parseError;
      }

      const normalizedState = normalizeState({
        ...remoteState,
        activeCategory: state.activeCategory
      });

      if (Object.prototype.hasOwnProperty.call(remoteState, "photos")) {
        return {
          ...normalizedState,
          photos: normalizePhotoState(remoteState.photos)
        };
      }

      return normalizedState;
    }

    async function pullRemoteState({ silent = false, force = false } = {}) {
      if (!canReadSync()) return { applied: false, remoteMissing: false };

      try {
        const remoteState = await fetchRemoteSnapshot(canWriteSync());
        const remoteUpdatedAt = Number(remoteState.updatedAt) || 0;
        const localUpdatedAt = Number(state.updatedAt) || 0;
        const shouldApply = force || remoteUpdatedAt > localUpdatedAt;

        syncConfig.lastRemoteUpdatedAt = remoteUpdatedAt;
        persistSyncConfig();

        if (shouldApply) {
          applyRemoteState(remoteState);
          if (!silent) toast("已拉取最新共享内容");
          updateSyncStatus(`已拉取远端更新\n最近远端时间：${formatSyncTime(remoteUpdatedAt)}`);
          return { applied: true, remoteMissing: false };
        }

        updateSyncStatus(`已连接 Gist\n最近内容时间：${formatSyncTime(localUpdatedAt)}${canWriteSync() ? "\n当前可双向同步" : "\n当前为只读拉取"}`);
        return { applied: false, remoteMissing: false };
      } catch (error) {
        updateSyncStatus(`读取同步内容失败\n${error.message}`);
        if (!silent) toast("读取 GitHub 同步失败");
        return { applied: false, remoteMissing: error.code === "missing-file" };
      }
    }

    function scheduleRemotePush() {
      window.clearTimeout(syncPushTimer);
      if (!canWriteSync()) return;
      syncPushTimer = window.setTimeout(() => {
        void pushRemoteState();
      }, 900);
    }

    async function pushRemoteState({ manual = false } = {}) {
      if (!canWriteSync()) {
        if (manual) toast("请先在同步设置里填写 GitHub token");
        return false;
      }

      try {
        let remoteUpdatedAt = 0;
        try {
          const remoteState = await fetchRemoteSnapshot(true);
          remoteUpdatedAt = Number(remoteState.updatedAt) || 0;
          if (remoteUpdatedAt > Number(state.updatedAt || 0)) {
            applyRemoteState(remoteState);
            updateSyncStatus(`检测到远端内容更新得更晚，已先拉取远端版本\n最近远端时间：${formatSyncTime(remoteUpdatedAt)}`);
            if (manual) toast("检测到对方的新修改，已先拉取")
            return false;
          }
        } catch (error) {
          if (!String(error.message).includes("同步文件")) throw error;
        }

        const payload = buildSharedStatePayload();
        const payloadContent = serializeSharedStatePayload(payload);
        const response = await fetch(`https://api.github.com/gists/${encodeURIComponent(syncConfig.gistId)}`, {
          method: "PATCH",
          headers: {
            ...githubHeaders(true),
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            files: {
              [syncConfig.fileName || SYNC_DEFAULT_FILE]: {
                content: payloadContent
              }
            }
          })
        });

        if (!response.ok) {
          if (response.status === 401 || response.status === 403) throw new Error("GitHub 拒绝写入，请检查 token 是否有 gist 权限。");
          throw new Error(`写入 GitHub 失败（${response.status}）。`);
        }

        syncConfig.lastRemoteUpdatedAt = Number(payload.updatedAt) || Date.now();
        persistSyncConfig();
        updateSyncStatus(`写入 GitHub 成功\n最近写入时间：${formatSyncTime(payload.updatedAt)}`);
        if (manual) toast("已同步到 GitHub");
        return true;
      } catch (error) {
        updateSyncStatus(`写入同步内容失败\n${error.message}`);
        if (manual) toast("写入 GitHub 同步失败");
        return false;
      }
    }

    async function saveSyncSettings(event) {
      event.preventDefault();
      const previousGistId = syncConfig.gistId;
      const previousFileName = syncConfig.fileName;
      const nextGistId = els.syncGistId.value.trim();
      const nextFileName = els.syncFileName.value.trim() || SYNC_DEFAULT_FILE;
      const targetChanged = nextGistId !== previousGistId || nextFileName !== previousFileName;

      syncConfig = {
        gistId: nextGistId,
        fileName: nextFileName,
        token: els.syncToken.value.trim(),
        lastRemoteUpdatedAt: targetChanged ? 0 : Number(syncConfig.lastRemoteUpdatedAt) || 0
      };
      persistSyncConfig();
      populateSyncForm();
      const firstConnect = Boolean(syncConfig.gistId) && (targetChanged || !syncConfig.lastRemoteUpdatedAt);
      const initialPull = await setupSync({ preferRemote: firstConnect });

      if (!syncConfig.gistId) {
        toast("已切回本地保存模式");
        return;
      }

      if (initialPull.remoteMissing && canWriteSync()) {
        await pushRemoteState({ manual: true });
      } else {
        toast("同步设置已保存");
      }
    }

    async function createSharedGist() {
      const token = els.syncToken.value.trim();
      const fileName = els.syncFileName.value.trim() || SYNC_DEFAULT_FILE;
      if (!token) {
        toast("先填写 GitHub token 才能创建 Gist");
        return;
      }

      try {
        updateSyncStatus("正在创建共享 Gist…");
        const payloadContent = serializeSharedStatePayload(buildSharedStatePayload());
        const response = await fetch("https://api.github.com/gists", {
          method: "POST",
          headers: {
            Accept: "application/vnd.github+json",
            Authorization: `Bearer ${token}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            description: "Couple todo sync",
            public: false,
            files: {
              [fileName]: {
                content: payloadContent
              }
            }
          })
        });

        if (!response.ok) {
          if (response.status === 401 || response.status === 403) throw new Error("GitHub 拒绝创建 Gist，请检查 token 是否有 gist 权限。");
          throw new Error(`创建 Gist 失败（${response.status}）。`);
        }

        const gist = await response.json();
        syncConfig = {
          gistId: gist.id,
          fileName,
          token,
          lastRemoteUpdatedAt: Number(state.updatedAt) || Date.now()
        };
        persistSyncConfig();
        populateSyncForm();
        await setupSync();
        updateSyncStatus(`共享 Gist 已创建\nGist ID：${gist.id}\n请把这个 Gist ID 填到另一台设备里。`);
        toast("已创建共享 Gist");
      } catch (error) {
        updateSyncStatus(`创建共享 Gist 失败\n${error.message}`);
        toast("创建共享 Gist 失败");
      }
    }

    async function syncNow() {
      if (!canReadSync()) {
        toast("请先配置 Gist ID");
        return;
      }

      const before = Number(state.updatedAt) || 0;
      const result = await pullRemoteState({ silent: true, force: !syncConfig.lastRemoteUpdatedAt });
      if (result.applied && Number(state.updatedAt) >= before) {
        toast("已拉取最新共享内容");
        return;
      }

      if (result.remoteMissing && canWriteSync()) {
        await pushRemoteState({ manual: true });
        return;
      }

      if (canWriteSync()) {
        await pushRemoteState({ manual: true });
      } else {
        toast("当前是只读同步，已检查远端内容");
      }
    }

    async function updateFromGithub() {
      if (!canReadSync()) {
        toast("请先在 Gist 同步里完成配置");
        return;
      }

      const result = await pullRemoteState({ silent: false, force: true });
      if (result.remoteMissing) {
        toast("GitHub 上还没有同步文件，先点同步内容");
        return;
      }

      if (!result.applied) {
        toast("已经是 GitHub 上的最新内容");
      }
    }

    async function syncToGithub() {
      if (!canWriteSync()) {
        toast("请先在 Gist 同步里填写可写 token");
        return;
      }

      await pushRemoteState({ manual: true });
    }

    function disconnectSync() {
      window.clearInterval(syncPullTimer);
      window.clearTimeout(syncPushTimer);
      syncPullTimer = null;
      syncPushTimer = null;
      syncConfig = {
        gistId: "",
        fileName: SYNC_DEFAULT_FILE,
        token: "",
        lastRemoteUpdatedAt: 0
      };
      persistSyncConfig();
      populateSyncForm();
      updateSyncStatus("已断开 GitHub 同步\n之后只会继续保存在当前浏览器里。");
      toast("已断开同步");
    }

    function orderCategories(categories) {
      return [...categories].sort((left, right) => {
        if (left.id === "date") return -1;
        if (right.id === "date") return 1;
        return 0;
      });
    }

    function getCategory(categoryId) {
      return state.categories.find((category) => category.id === categoryId) || { name: "未分类", color: "#d84b68" };
    }

    function priorityRank(priority) {
      return { high: 3, medium: 2, low: 1 }[priority] || 1;
    }

    function formatDate(date) {
      const parsed = new Date(`${date}T00:00:00`);
      if (Number.isNaN(parsed.getTime())) return date;
      return `${parsed.getMonth() + 1}月${parsed.getDate()}日`;
    }

    function nextWeekend() {
      const now = new Date();
      const day = now.getDay();
      const diff = day === 0 ? 6 : 6 - day;
      now.setDate(now.getDate() + diff);
      return now.toISOString().slice(0, 10);
    }

    function toast(message) {
      els.toast.textContent = message;
      els.toast.classList.add("show");
      window.clearTimeout(toast.timer);
      toast.timer = window.setTimeout(() => els.toast.classList.remove("show"), 1800);
    }

    function makeId() {
      return Math.random().toString(36).slice(2) + Date.now().toString(36);
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"]/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" }[char]));
    }

    function escapeAttribute(value) {
      return escapeHtml(value).replace(/'/g, "&#39;");
    }
  </script>
</body>
</html>
